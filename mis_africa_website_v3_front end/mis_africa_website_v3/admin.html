<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MIS Africa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Admin Specific Styles */
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .dashboard {
            display: none;
            /* Hidden by default */
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .submissions-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .submissions-table th,
        .submissions-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .submissions-table th {
            background-color: var(--primary-color);
            color: white;
        }

        .status-pending {
            color: orange;
            font-weight: bold;
        }

        .status-approved {
            color: green;
            font-weight: bold;
        }

        .status-rejected {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="assets/images/logo.png" alt="MIS Africa Logo" style="height: 50px;">
                    Admin Panel
                </a>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <div id="login-section" class="login-box">
        <h2><i class="fas fa-lock"></i> Admin Login</h2>
        <p>Please sign in to access submissions.</p>
        <form id="login-form">
            <div class="form-group">
                <input type="email" id="admin-email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="admin-password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            <p id="login-error" style="color: red; margin-top: 1rem; font-size: 0.9rem;"></p>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="admin-container dashboard">
        <div class="dashboard-header">
            <h1>Submissions Dashboard</h1>
            <button id="logout-btn" class="btn btn-secondary">Logout</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="submissions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Institution</th>
                        <th>Abstract Title</th>
                        <th>File</th>
                    </tr>
                </thead>
                <tbody id="submissions-body">
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>

</html>
